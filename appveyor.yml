image: Visual Studio 2022

matrix:
  fast_finish: true

platform:
  - x64

branches:
  only:
    - main
    - release

skip_tags: true

cache:
  - node_modules -> package.json
  - '%USERPROFILE%\.electron'
  - '%LOCALAPPDATA%\electron\Cache'
  - '%LOCALAPPDATA%\electron-builder\Cache'

install:
  - ps: |
      $v = "18.18.2"
      $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
      Write-Host "Downloading Node.js v$v from $url"
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest $url -OutFile "$env:TEMP\node.zip" -UseBasicParsing
      Expand-Archive "$env:TEMP\node.zip" -DestinationPath C:\ -Force
      $nodePath = "C:\node-v$v-win-x64"
      $env:Path = "$nodePath;$env:Path"
      [Environment]::SetEnvironmentVariable("PATH", $env:Path, "Machine")
      Write-Host "Node.js v$v installed to $nodePath"
  - cmd: pip install setuptools
  - node --version
  - npm --version
  - npm install --ignore-scripts
  - ps: |
      # Patch NodeRT common.gypi to use available Windows SDK — the package
      # hardcodes 10.0.14393.0 (Anniversary Update) which is not on VS2022 images.
      # AdditionalUsingDirectories in the gypi controls /AI paths for cl.exe;
      # setting LIBPATH alone does not fix C1107.
      $gypiPath = "node_modules\@nodert-win10-au\windows.applicationmodel\common.gypi"
      if (Test-Path $gypiPath) {
        $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
        $latestSdk = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object Name | Select-Object -Last 1
        if ($latestSdk) {
          $content = Get-Content $gypiPath -Raw
          $patched = $content -replace '10\.\d+\.\d+\.\d+', $latestSdk.Name
          [System.IO.File]::WriteAllText((Resolve-Path $gypiPath), $patched)
          Write-Host "Patched common.gypi: SDK -> $($latestSdk.Name)"
        } else {
          Write-Host "WARNING: no versioned SDK found under UnionMetadata"
        }
      } else {
        Write-Host "WARNING: common.gypi not found at $gypiPath"
      }
  - cmd: npm run css

build_script:
  - ps: |
      $libpaths = @()
      # Search for Windows.winmd in SDK UnionMetadata
      $umDir = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
      if (Test-Path $umDir) {
        $wmds = Get-ChildItem $umDir -Recurse -Filter "Windows.winmd" -ErrorAction SilentlyContinue
        if ($wmds) {
          $wmds | ForEach-Object { if ($libpaths -notcontains $_.DirectoryName) { $libpaths += $_.DirectoryName } }
        } else {
          # Fallback: add versioned dirs and Facade even without confirming the file
          $versioned = Get-ChildItem $umDir -Directory | Where-Object { $_.Name -match '^\d+\.' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($versioned) { $libpaths += $versioned.FullName }
          $facade = Join-Path $umDir "Facade"
          if (Test-Path $facade) { $libpaths += $facade }
        }
      }
      # Also include system WinMetadata (always present on Windows)
      $sysWinMeta = "C:\Windows\System32\WinMetadata"
      if ((Test-Path $sysWinMeta) -and ($libpaths -notcontains $sysWinMeta)) { $libpaths += $sysWinMeta }
      if ($libpaths.Count -gt 0) {
        $env:LIBPATH = $libpaths -join ";"
        Write-Host "LIBPATH=$env:LIBPATH"
      } else {
        Write-Host "WARNING: No WinMetadata paths found"
      }
      npm run build:win
      if ($LASTEXITCODE -ne 0) { throw "build:win failed with exit code $LASTEXITCODE" }

artifacts:
  - path: dist\*.exe
    name: installer
