image: Visual Studio 2022

matrix:
  fast_finish: true

platform:
  - x64

branches:
  only:
    - main
    - release

skip_tags: true

cache:
  - node_modules -> package.json
  - '%USERPROFILE%\.electron'
  - '%LOCALAPPDATA%\electron\Cache'
  - '%LOCALAPPDATA%\electron-builder\Cache'

install:
  - ps: |
      $v = "18.18.2"
      $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
      Write-Host "Downloading Node.js v$v from $url"
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest $url -OutFile "$env:TEMP\node.zip" -UseBasicParsing
      Expand-Archive "$env:TEMP\node.zip" -DestinationPath C:\ -Force
      $nodePath = "C:\node-v$v-win-x64"
      $env:Path = "$nodePath;$env:Path"
      [Environment]::SetEnvironmentVariable("PATH", $env:Path, "Machine")
      Write-Host "Node.js v$v installed to $nodePath"
  - cmd: pip install setuptools
  - node --version
  - npm --version
  - npm install --ignore-scripts
  - cmd: npm run css

build_script:
  - cmd: npm run build:win

artifacts:
  - path: dist\*.exe
    name: installer
