image: Visual Studio 2022

matrix:
  fast_finish: true

platform:
  - x64

branches:
  only:
    - main
    - release

skip_tags: true

cache:
  - node_modules -> package.json
  - '%USERPROFILE%\.electron'
  - '%LOCALAPPDATA%\electron\Cache'
  - '%LOCALAPPDATA%\electron-builder\Cache'

install:
  - ps: |
      $v = "18.18.2"
      $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
      Write-Host "Downloading Node.js v$v from $url"
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest $url -OutFile "$env:TEMP\node.zip" -UseBasicParsing
      Expand-Archive "$env:TEMP\node.zip" -DestinationPath C:\ -Force
      $nodePath = "C:\node-v$v-win-x64"
      $env:Path = "$nodePath;$env:Path"
      [Environment]::SetEnvironmentVariable("PATH", $env:Path, "Machine")
      Write-Host "Node.js v$v installed to $nodePath"
  - cmd: pip install setuptools
  - node --version
  - npm --version
  - npm install --ignore-scripts
  - cmd: npm run css

build_script:
  - ps: |
      $umDir = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
      $libpaths = @()
      if (Test-Path $umDir) {
        $versioned = Get-ChildItem $umDir -Directory | Where-Object { $_.Name -match '^\d+\.' } | Sort-Object Name -Descending | Select-Object -First 1
        if ($versioned) { $libpaths += $versioned.FullName }
        $facade = Join-Path $umDir "Facade"
        if (Test-Path $facade) { $libpaths += $facade }
      }
      if ($libpaths.Count -gt 0) {
        $env:LIBPATH = $libpaths -join ";"
        Write-Host "LIBPATH=$env:LIBPATH"
      } else {
        Write-Host "WARNING: No UnionMetadata paths found"
      }
      npm run build:win
      if ($LASTEXITCODE -ne 0) { throw "build:win failed with exit code $LASTEXITCODE" }

artifacts:
  - path: dist\*.exe
    name: installer
