image: Visual Studio 2022

matrix:
  fast_finish: true

platform:
  - x64
  - x86

branches:
  only:
    - main
    - release

skip_tags: true

cache:
  - node_modules -> package.json
  - '%USERPROFILE%\.electron'
  - '%LOCALAPPDATA%\electron\Cache'
  - '%LOCALAPPDATA%\electron-builder\Cache'

install:
  - ps: |
      $v = "18.18.2"
      $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
      Write-Host "Downloading Node.js v$v from $url"
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest $url -OutFile "$env:TEMP\node.zip" -UseBasicParsing
      Expand-Archive "$env:TEMP\node.zip" -DestinationPath C:\ -Force
      $nodePath = "C:\node-v$v-win-x64"
      $env:Path = "$nodePath;$env:Path"
      [Environment]::SetEnvironmentVariable("PATH", $env:Path, "Machine")
      Write-Host "Node.js v$v installed to $nodePath"
  - cmd: pip install setuptools
  - node --version
  - npm --version
  - npm install
  - ps: |
      # Patch NodeRT binding.gyp to use the installed versioned SDK path.
      # The package hardcodes the bare UnionMetadata/ root; on VS2022 images
      # Windows.winmd lives in a versioned subdirectory (e.g. 10.0.26100.0/).
      $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
      $latestSdk = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
        Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
        Sort-Object Name | Select-Object -Last 1
      $gypPath = "node_modules\@nodert-win10-au\windows.applicationmodel\binding.gyp"
      if ($latestSdk -and (Test-Path $gypPath)) {
        $ver = $latestSdk.Name
        $content = Get-Content $gypPath -Raw
        $patched = $content `
          -replace '%ProgramFiles\(x86\)%/Windows Kits/10/UnionMetadata/', "%ProgramFiles(x86)%/Windows Kits/10/UnionMetadata/$ver/" `
          -replace '%ProgramFiles%/Windows Kits/10/UnionMetadata/', "%ProgramFiles%/Windows Kits/10/UnionMetadata/$ver/"
        # Also enable multi-processor C++ compilation to speed up the WinRT build
        $patched = $patched -replace '"/ZW"', '"/ZW", "/MP"'
        [System.IO.File]::WriteAllText((Resolve-Path $gypPath), $patched)
        Write-Host "Patched binding.gyp: UnionMetadata -> $ver, added /MP"
      } else {
        Write-Host "WARNING: SDK not found or binding.gyp missing"
      }
  - cmd: npm run css

build_script:
  - ps: |
      # Build only the arch matching the AppVeyor job platform so each job
      # rebuilds native modules once instead of twice (--ia32 --x64 doubles
      # compile time and hits the 60-min timeout).
      $arch = if ($env:PLATFORM -eq 'x86') { '--ia32' } else { '--x64' }
      Write-Host "Building arch: $arch"
      cmd /c "npx electron-builder --win $arch --publish never"
      exit $LASTEXITCODE

artifacts:
  - path: dist\*.exe
    name: installer
