image: Visual Studio 2022

matrix:
  fast_finish: true

platform:
  - x64

branches:
  only:
    - main
    - release

skip_tags: true

environment:
  nodejs_version: "18.18.2"

cache:
  - node_modules -> package.json
  - '%USERPROFILE%\.electron'

install:
  - ps: nvm install $env:nodejs_version
  - ps: nvm use $env:nodejs_version
  - node --version
  - npm --version
  - npm install

build_script:
  - cmd: npm run build:win

artifacts:
  - path: dist\*.exe
    name: installer
