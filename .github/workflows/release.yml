name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Build and publish macOS
        run: npx electron-builder --macos --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows
        # x64 only — uiohook-napi ships no ia32 N-API prebuilt (npmRebuild is disabled)
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build and publish Linux
        run: npx electron-builder --linux AppImage deb --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-snap:
    runs-on: ubuntu-latest
    needs: release-linux
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap and attach to GitHub release
        run: npx electron-builder --linux snap --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # app-builder-bin still runs the removed `snapcraft push` (exit 64 on
      # snapcraft >=8), so upload to the Snap Store directly instead of via
      # electron-builder's snapStore publisher.
      - name: Publish snap to Snap Store
        run: snapcraft upload --release=stable dist/*.snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
